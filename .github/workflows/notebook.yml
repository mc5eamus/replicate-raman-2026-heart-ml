name: Standalone notebook

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "tests/test_notebook.py"
      - ".github/workflows/notebook.yml"
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "tests/test_notebook.py"
      - ".github/workflows/notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt
      - name: Install only the notebook environment
        run: |
          python -m pip install -r notebooks/requirements.txt
          python -m pip check
      - name: Check standalone code and modelling invariants
        run: python -m unittest discover -s tests -p test_notebook.py -v
      - name: Execute all sections with the default 50 splits
        run: |
          timeout 900 jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --output-dir=/tmp --output=raman2026_executed \
            notebooks/raman2026_reproduction.ipynb
      - name: Check freshly rendered outputs
        run: |
          RAMAN_EXECUTED_NOTEBOOK=/tmp/raman2026_executed.ipynb \
            python -m unittest discover -s tests -p test_notebook.py -v
